[pipeline]
display=1
num_sources = 1             # Number of input sources for the pipeline
#muxer_width = 1280          # Width for nvstreammux output frames
#muxer_height = 720          # Height for nvstreammux output frames
muxer_batch_size = 1        # Batch size for nvstreammux. Should typically match num_sources.
#rtsp_bitrate = 4000000      # Target bitrate for the H.264 encoder in bps (e.g., 4 Mbps).
rec_threshold = 0.35
enable_rtsp_streaming = true # Set to 'true' to enable the internal RTSP server.
is_aarch64=0
known_face_dir="/workspace/data/known_faces"
save_feature=0
save_feature_path="/workspace/data/features"
rtsp_reconnect_interval = 10
#sgie_input_width = 112  # Or whatever your ArcFace model actually expects
#sgie_input_height = 112 

[streammux]
# GStreamer nvstreammux settings
gpu_id = 0
batch-size = 1
width = 1280
height = 720
live-source = 1
nvbuf-memory-type = 0
#batched-push-timeout = 40000


[nvosd]
process-mode=0
display-text=1

