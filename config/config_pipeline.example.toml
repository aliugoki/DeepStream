# Example pipeline config — copy to config_pipeline.toml and fill in real values.
# The real config_pipeline.toml is gitignored (it contains camera credentials).
[pipeline]
display = 0
num_sources = 1
muxer_batch_size = 1
rec_threshold = 0.35           # cosine match threshold
rec_margin = 0.05              # top1 - top2 margin gate
known_face_dir = "/workspace/data/known_faces"
health_port = 9108             # enterprise pipeline health/metrics (:9108/healthz, /metrics)

# --- Anti-spoofing (liveness) — reject printed/screen photos of an employee. ---
antispoof_enabled = false      # true to gate attendance on a live face
antispoof_model = "/workspace/models/antispoof/2.7_80x80_MiniFASNetV2static.onnx"
antispoof_min_score = 0.5      # min "live" probability (0..1) to accept; raise to be stricter

# --- BACKFILL — replay NVR footage after a live outage. When [backfill].clip_start
# is set, attendance is stamped with the RECORDING time (clip_start + frame PTS)
# instead of wall-clock, so re-processed video lands at the moment it happened.
# Point the [[sources]] uri at the clip (file:///workspace/data/backfill/<clip>.mp4)
# and, for >24x-realtime, raise the PGIE `interval` (skip frames) — a file source
# is decoded unthrottled (NVDEC) since live-source is off for non-rtsp URIs.
[backfill]
clip_start = ""                # e.g. "2026-07-10T08:00:00" — empty = live mode

[streammux]
gpu_id = 0
batch-size = 1
width = 1280
height = 720
live-source = 1
nvbuf-memory-type = 0
batched-push-timeout = 40000

[nvosd]
process-mode = 0
display-text = 1

[pgie]
config-file-path = "/workspace/config/config_yolo.txt"
[sgie]
config-file-path = "/workspace/config/config_arcface.txt"
[tracker]
config-file-path = "/workspace/config/config_tracker_perf.txt"

[tiler]
width = 1280
height = 720

[rtsp_server]
mount-point = "/mystream"
enable_rtsp_streaming = false
port = 8555
codec = "H264"
udpsink-port = 5400
udpsink-host = "127.0.0.1"

# One [[sources]] per camera. URL-encode special chars in the password (@ -> %40).
[[sources]]
id = "cam1"
uri = "rtsp://USER:PASSWORD@CAMERA_IP:554?transport=tcp"
type = "entrance"              # entrance | exit | general
num-retry = 5
rtsp-reconnect-interval-sec = 10
latency = 200

# Optional: feed recognized identities to VisionTrack (see VISIONTRACK_LINK.md)
# [visiontrack]
# enabled = false
# redis_url = "redis://localhost:6379/0"
